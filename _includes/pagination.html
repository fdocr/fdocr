{% if paginator.total_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    {% if paginator.previous_page %}
      <a class="page-btn" href="{{ paginator.previous_page_path | relative_url }}">Previous</a>
    {% else %}
      <span class="page-btn is-disabled">Previous</span>
    {% endif %}
    <span class="page-status">{{ paginator.page }} / {{ paginator.total_pages }}</span>
    {% if paginator.next_page %}
      <a class="page-btn" href="{{ paginator.next_page_path | relative_url }}">Next</a>
    {% else %}
      <span class="page-btn is-disabled">Next</span>
    {% endif %}
  </nav>
{% endif %}
